plugins {
    id 'com.android.application'
}

android {
    namespace 'com.appoup.videotomp3'
    compileSdk 35

    defaultConfig {
        applicationId "com.appoup.videotomp3"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
        resConfigs "en"
    }

    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'videotomp3'
            keyAlias 'videotomp3'
            keyPassword 'videotomp3'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // امضاشده و آمادهٔ انتشار. بهینه‌سازی R8 خاموش است تا رفتار اجرا کاملاً قابل‌اتکا بماند؛
            // در صورت تمایل می‌توان minifyEnabled/shrinkResources را true کرد.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity:1.9.3'

    // Native LAME MP3 encoder for Android — runs entirely on the device (no server).
    // The video's audio is decoded with Android MediaCodec and re-encoded to true MP3.
    // Its legacy support-library dependency is excluded to avoid AndroidX duplicate classes.
    implementation('com.github.naman14:TAndroidLame:1.1') {
        exclude group: 'com.android.support'
    }
}
