plugins {
    id 'com.android.application'
}

android {
    namespace 'com.appoup.videotomp3'
    compileSdk 35

    defaultConfig {
        applicationId "com.appoup.videotomp3"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity:1.9.3'

    // رمزگذار MP3 بومی (LAME) برای اندروید — کاملاً روی خود گوشی اجرا می‌شود (بدون سرور).
    // decode صدای ویدیو با MediaCodec خود اندروید انجام می‌شود و سپس به MP3 واقعی رمزگذاری می‌شود.
    // وابستگی قدیمی support library آن حذف می‌شود تا با AndroidX تداخل کلاس نداشته باشد.
    implementation('com.github.naman14:TAndroidLame:1.1') {
        exclude group: 'com.android.support'
    }
}
