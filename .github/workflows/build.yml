name: Build APK

# این workflow به‌صورت خودکار APK را می‌سازد و برای دانلود آپلود می‌کند.
# با هر push یا به‌صورت دستی (دکمهٔ Run workflow) اجرا می‌شود.

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    # نسخهٔ پایدار؛ Android SDK روی این ایمیج از پیش نصب است.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          echo "::group::Gradle output (tail)"
          tail -n 150 build.log
          echo "::endgroup::"
          if [ $code -ne 0 ]; then
            grep -nE "Could not|Caused by:|error:|FAILURE:|What went wrong|Could not resolve|No matching|> Task|^> " build.log \
              | grep -viE "warning|deprecat" | tail -n 20 \
              | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          exit $code

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoToMp3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
