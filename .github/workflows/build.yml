name: Build APK

# این workflow به‌صورت خودکار APK را می‌سازد و برای دانلود آپلود می‌کند.
# با هر push یا به‌صورت دستی (دکمهٔ Run workflow) اجرا می‌شود.

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    # نسخهٔ پایدار؛ Android SDK روی این ایمیج از پیش نصب است.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoToMp3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
