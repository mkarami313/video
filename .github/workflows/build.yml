name: Build APK

# Builds a signed release APK automatically and uploads it for download.
# Runs on every push or manually (Run workflow button).

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    # Stable image; the Android SDK is preinstalled here.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build release APK
        run: |
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace > build.log 2>&1
          code=$?
          echo "::group::Gradle output (tail)"
          tail -n 150 build.log
          echo "::endgroup::"
          if [ $code -ne 0 ]; then
            grep -nE "Duplicate class|is defined in multiple|found in modules|Could not|Caused by:|error:|FAILURE:|What went wrong|Could not resolve|No matching" build.log \
              | grep -viE "warning|deprecat" | tail -n 25 \
              | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          exit $code

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoToMp3-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
