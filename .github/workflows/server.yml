name: Run on server

# Connects to your Ubuntu server over SSH (password auth) and runs a command.
# Runs only when you start it manually from the Actions tab.
# Credentials come from repository Secrets — never from the code.

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Command to run on the server"
        required: true
        default: 'echo "✅ Connected"; lsb_release -a; echo "---"; uptime; echo "---"; df -h /'

jobs:
  ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Run command over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: ${{ github.event.inputs.command }}
